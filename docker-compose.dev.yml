# Local build with bind mounts and hot reload (docs/PLAN.md §9.5).
#   docker compose -f docker-compose.dev.yml up --build
# The library is a copy of the fixture library so nothing real is touched.
services:
  musicbutler:
    build:
      context: .
    environment:
      MUSIC_DIR: /music
      MODEL_CACHE_DIR: /models
      # Languages to run. English is baked into the image; anything else here is
      # downloaded on the first start.
      MUSICBUTLER_LANGS: "${MUSICBUTLER_LANGS:-en-US}"
      PORT: "3000"
      LOG_LEVEL: debug
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ${DEV_MUSIC_DIR:-./fixtures/library}:/music
      - ./apps/server/src:/app/apps/server/src:ro
      - ./packages:/app/packages:ro
      - musicbutler-models-dev:/models
    ports:
      - "127.0.0.1:3000:3000"
    command: ["bun", "--watch", "apps/server/src/index.ts"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  musicbutler-models-dev:
