name: Release image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/musicbutler
jobs:
  # The image is built only when the same checks that ci.yml runs are green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun pm trust --all || true
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  # One native build per architecture (docs/PLAN.md §9.4: never drop arm64; QEMU
  # is too slow for the ONNX dependencies). Each pushes by digest; `merge` joins them.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: arch
        run: echo "name=${{ matrix.platform }}" | sed 's#/#-#g' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `docker inspect` reads the labels from the image config, so they have to
      # be baked in per architecture. The manifest list gets the same values as
      # annotations in `merge`. Workflows cannot share a YAML anchor across
      # jobs, so the list is written twice on purpose.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted lyrics sync for a Navidrome library
            org.opencontainers.image.licenses=AGPL-3.0-only
      # One image for every language: English is baked in, and the entrypoint
      # downloads anything else MUSICBUTLER_LANGS names (docs/PLAN.md §13.16).
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=en-${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=en-${{ steps.arch.outputs.name }}
      - name: Export digests
        run: |
          mkdir -p /tmp/digests
          # Artifact file names may not contain ":", so the `sha256:` prefix is dropped here and re-added in `merge`.
          digest="${{ steps.image.outputs.digest }}"; touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.arch.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # `imagetools create` writes an index, so the annotations have to be
          # aimed at the index. The default aims them at the child manifests,
          # where GHCR does not read them.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted lyrics sync for a Navidrome library
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      # The annotations are what connect the package to this repository on GHCR
      # and what state the licence. They were computed before and never passed,
      # so the published index carried the base image's metadata instead.
      # An annotation value holds spaces, so the arguments are built as an array
      # rather than by splitting a string.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]? // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          printf 'argument: %s\n' "${args[@]}"
          docker buildx imagetools create "${args[@]}" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
